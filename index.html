<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>У меня к тебе вопрос</title>

  <!-- Превью ссылки в мессенджерах -->
  <meta property="og:title" content="У меня к тебе предложение…">
  <meta property="og:description" content="Открой, это важно ♥">
  <meta property="og:image" content="img/hand.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Экран загрузки -->
  <div class="loader" id="loader">
    <div class="loader__label">ЗАГРУЗКА САЙТА</div>
    <div class="loader__count" id="loaderCount">000</div>
    <div class="loader__bar"><i id="loaderBar"></i></div>
    <div class="loader__hint">// не закрывай, это важно</div>
  </div>

  <!-- Фоны, искры, шум, свечение курсора -->
  <div class="bg" id="bg"></div>
  <canvas id="fx"></canvas>
  <div class="grain"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="frame"><i></i><i></i><i></i><i></i></div>
  <div class="cursor" id="cursor"></div>

  <!-- Верхняя панель -->
  <header class="hud">
    <button class="hud__back" id="backBtn" aria-label="Назад">← НАЗАД</button>
    <div class="hud__step"><b id="stepNow">01</b>/<span id="stepTotal">08</span></div>
    <div class="hud__progress"><i id="progress"></i></div>
  </header>

  <!-- Сюда скрипт рисует экраны -->
  <main id="app"></main>

  <button class="music" id="musicBtn" hidden aria-label="Музыка">
    <span></span><span></span><span></span><span></span>
  </button>
  <audio id="music" loop preload="none"></audio>

  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
